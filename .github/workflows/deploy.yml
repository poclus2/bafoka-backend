name: Deploy to DigitalOcean
run-name: "🚀 Deploy #${{ github.run_number }} — ${{ github.actor }}"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Permet un déclenchement manuel depuis l'UI GitHub

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================
  # Job 1: Build & Push l'image Docker
  # ============================================
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Cache des couches Docker → builds jusqu'à 5x plus rapides
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache GitHub Actions → évite de reconstruire les layers inchangés
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # Job 2: Déploiement sur le serveur
  # ============================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build # S'exécute uniquement si le build réussit
    environment: production # Environnement protégé (peut nécessiter approbation manuelle)

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          # SÉCURITÉ: SSH par clé privée, pas par mot de passe
          # Ajouter la clé privée dans Settings > Secrets > DO_SSH_KEY
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            CONTAINER="bafoka-dao-backend"
            ENV_FILE="/root/bafoka-backend/.env.production"

            echo "📦 Pull de la nouvelle image..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull "$IMAGE"

            echo "🔄 Blue/Green: démarrage du nouveau conteneur..."
            OLD_CONTAINER="${CONTAINER}-old"

            # Renommer l'ancien conteneur (rollback possible)
            docker rename "$CONTAINER" "$OLD_CONTAINER" 2>/dev/null || true

            # Démarrer le nouveau conteneur
            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p 3001:3001 \
              --env-file "$ENV_FILE" \
              --log-opt max-size=50m \
              --log-opt max-file=3 \
              "$IMAGE"

            echo "⏳ Health check (30s max)..."
            for i in $(seq 1 6); do
              sleep 5
              STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:3001/api/health || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "✅ Health check OK!"
                docker rm -f "$OLD_CONTAINER" 2>/dev/null || true
                docker image prune -f
                echo "🎉 Déploiement réussi!"
                exit 0
              fi
              echo "   Tentative $i/6 — statut: $STATUS"
            done

            echo "❌ Health check échoué. Rollback en cours..."
            docker rm -f "$CONTAINER" 2>/dev/null || true
            docker rename "$OLD_CONTAINER" "$CONTAINER" 2>/dev/null || true
            docker start "$CONTAINER" 2>/dev/null || true
            exit 1
